<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Auth Page -->
    <div id="auth-page" class="page active">
        <div class="container">
            <div class="auth-box">
                <h1 class="logo">📋 Task Manager</h1>
                <p class="subtitle">Organize your tasks efficiently</p>
                
                <div class="tabs">
                    <button class="tab active" data-tab="login">Login</button>
                    <button class="tab" data-tab="register">Register</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form active">
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="login-email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>

                <!-- Register Form -->
                <form id="register-form" class="auth-form">
                    <div class="form-group">
                        <label>Name</label>
                        <input type="text" id="register-name" placeholder="John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="register-email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="register-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>

                <div id="auth-message" class="message"></div>
            </div>
        </div>
    </div>

    <!-- Dashboard Page -->
    <div id="dashboard-page" class="page">
        <div class="navbar">
            <div class="navbar-brand">📋 Task Manager</div>
            <div class="navbar-actions">
                <span id="user-name" class="user-name"></span>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>

        <div class="container">
            <div class="dashboard-header">
                <h2>My Tasks</h2>
                <button id="add-task-btn" class="btn btn-primary">+ Add Task</button>
            </div>

            <!-- Add Task Form -->
            <div id="task-form-container" class="task-form-container" style="display: none;">
                <form id="task-form">
                    <div class="form-group">
                        <label>Task Title</label>
                        <input type="text" id="task-title" placeholder="Enter task title" required>
                    </div>
                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="task-description" placeholder="Enter task description" rows="3"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Create Task</button>
                        <button type="button" id="cancel-task-btn" class="btn btn-secondary">Cancel</button>
                    </div>
                </form>
            </div>

            <!-- Tasks List -->
            <div id="tasks-container" class="tasks-container">
                <div class="loading">Loading tasks...</div>
            </div>

            <div id="dashboard-message" class="message"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
